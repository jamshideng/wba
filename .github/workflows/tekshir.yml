name: tekshir

# Har PR va main'ga push'da: test, typecheck, eslint, build va baza testi.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  kod:
    name: test · typecheck · eslint · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npx eslint src scripts
      # Kalitsiz build — sayt "Supabase ulanmagan" holatida yig'iladi.
      # NEXT_PUBLIC_SITE_URL yo'q bo'lsa ham saytManzil() zaxiraga tushadi.
      - run: npx next build

  baza:
    name: migratsiya + RLS testi
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wba_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: wba_test
    steps:
      - uses: actions/checkout@v4
      - name: psql o'rnatish
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Shim + migratsiyalar
        run: |
          psql -q -v ON_ERROR_STOP=1 -f supabase/_test_shim.sql
          for f in supabase/migrations/0*.sql; do
            echo "   $f"
            psql -q -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Mantiq va RLS testlari
        run: psql -v ON_ERROR_STOP=1 -f supabase/_test_logic.sql
