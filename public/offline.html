<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D0A09">
<title>Internet yo‘q · WBA</title>
<style>
  :root { --bg:#0d0a09; --surface:#171110; --line:#2c211e; --ink:#f8f4f2; --ink2:#b9aca7; --brand:#ff4d4a; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#faf7f5; --surface:#ffffff; --line:#e9e1dd; --ink:#1a1210; --ink2:#5c504b; --brand:#e0201c; }
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body {
    background:var(--bg); color:var(--ink);
    font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:24px 16px calc(24px + env(safe-area-inset-bottom));
  }
  main {
    width:100%; max-width:360px; text-align:center;
    background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:32px 24px;
  }
  img { width:56px; height:56px; }
  h1 { font-size:20px; margin:16px 0 8px; }
  p { color:var(--ink2); margin:0 0 24px; font-size:15px; }
  a {
    display:flex; align-items:center; justify-content:center; min-height:48px;
    background:var(--brand); color:#fff; text-decoration:none; font-weight:600; border-radius:10px;
  }
</style>
</head>
<body>
<main>
  <img src="/logo-qizil.png" alt="World Bridge Academy">
  <h1>Internet yo‘q</h1>
  <p>Telefonda internet ulanmagan ko‘rinadi. Ulanishni tekshirib, qayta urinib ko‘ring.</p>
  <a href="/crm">Qayta urinish</a>
</main>
<script>
  // Internet qaytsa — o'zi qayta yuklaydi
  addEventListener('online', function () { location.reload() })
</script>
</body>
</html>
